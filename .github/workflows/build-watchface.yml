name: Build DEAL GNB watchface with Zeus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-watchface.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image processing dependency
        run: python3 -m pip install --quiet pillow
      - name: Rebuild valid Zepp source project
        run: |
          python3 - <<'PY'
          import json, io, zipfile, pathlib
          source = pathlib.Path("releases/DEAL_GNB_Balance2_TEST.zpk")
          out = pathlib.Path("zepp-project")
          with zipfile.ZipFile(source) as pkg, zipfile.ZipFile(io.BytesIO(pkg.read("device.zip"))) as dev:
              bg = dev.read("assets/images/background.png")
              aod = dev.read("assets/images/aod.png")
          assets = out / "assets/default-target/images"
          assets.mkdir(parents=True, exist_ok=True)
          from PIL import Image, ImageDraw, ImageFilter
          # Rebuild art to 480x480: enlarge and center yellow drilling rig, add dial markers/icons.
          image = Image.open(io.BytesIO(bg)).convert("RGBA").resize((480,480), Image.Resampling.LANCZOS)
          logo = image.crop((128,48,356,91)).resize((278,52), Image.Resampling.LANCZOS)
          rig  = image.crop((58,93,318,172)).resize((370,110), Image.Resampling.LANCZOS)
          earth= image.crop((60,167,470,201)).resize((450,40), Image.Resampling.LANCZOS)
          d = ImageDraw.Draw(image)
          d.rectangle((45,40,433,203),fill=(2,3,6,255))
          image.paste(logo,(101,36))
          image.paste(rig,(53,92))
          image.paste(earth,(16,171))
          d = ImageDraw.Draw(image)
          # Leave a clean, high-contrast area for live time/date.
          d.rounded_rectangle((39,213,441,330),radius=22,fill=(1,2,4,250))
          d.line((56,325,424,325),fill=(80,84,91,255),width=2)
          d.rounded_rectangle((45,331,435,438),radius=13,fill=(6,7,10,253))
          for xx in (145,239,331):
              d.line((xx,343,xx,416),fill=(84,86,94,255),width=2)
          # Battery, footsteps, heart and weather symbols, centered over live values.
          Y=(255,198,16,255); W=(238,238,240,255)
          d.rounded_rectangle((81,346,112,363),radius=3,outline=W,width=3)
          d.rectangle((112,351,116,358),fill=W)
          d.polygon([(97,347),(90,357),(96,357),(92,363),(106,351),(99,351)],fill=Y)
          for x,y in [(177,348),(172,359),(196,348),(190,359)]:
              d.ellipse((x,y,x+9,y+13),fill=Y)
          d.polygon([(285,365),(267,349),(271,342),(280,343),(285,348),(291,343),(301,344),(304,351)],fill=Y)
          d.line([(273,354),(280,354),(284,348),(288,360),(293,353),(299,353)],fill=(12,15,19,255),width=2)
          d.ellipse((376,342,393,360),outline=Y,width=2)
          d.ellipse((367,354,382,370),fill=(20,22,26,255),outline=W,width=2)
          d.ellipse((376,350,395,370),fill=(20,22,26,255),outline=W,width=2)
          d.rounded_rectangle((363,357,399,373),radius=6,fill=(20,22,26,255),outline=W,width=2)
          d.arc((233,444,247,459),start=180,end=360,fill=W,width=2)
          image.save(assets/"background.png")
          (assets/"aod.png").write_bytes(aod)
          app = {
            "configVersion": "v3",
            "app": {
              "appId": 7761421,
              "appName": "DEAL_GNB Balance 2",
              "appType": "watchface",
              "version": {"code": 3, "name": "1.0.2"},
              "vender": "DEAL_GNB",
              "description": "DEAL_GNB industrial watch face for Amazfit Balance 2",
              "icon": "images/background.png"
            },
            "permissions": ["data:user.hd.step", "data:user.hd.heart_rate"],
            "runtime": {"apiVersion": {"compatible": "2.0", "target": "4.2", "minVersion": "2.0"}},
            "targets": {
              "default-target": {
                "module": {"watchface": {"path":"watchface/default-target/index","main":1,"editable":0,"lockscreen":0}},
                "platforms": [
                  {"name":"Amazfit Balance 2", "deviceSource":9568512},
                  {"name":"Amazfit Balance 2", "deviceSource":9568513},
                  {"name":"Amazfit Balance 2", "deviceSource":9568515}
                ],
                "designWidth": 480
              }
            },
            "i18n": {"en-US":{"name":"DEAL_GNB Balance 2"}, "ru-RU":{"name":"DEAL_ГНБ Balance 2"}},
            "defaultLanguage": "en-US",
            "debug": False
          }
          (out/"app.json").write_text(json.dumps(app, ensure_ascii=False, indent=2), encoding="utf-8")
          (out/"app.js").write_text("App({globalData:{},onCreate(){},onDestroy(){}})\n", encoding="utf-8")
          code = r'''
          import ui from '@zos/ui'
          import { Time, Battery, Step, HeartRate } from '@zos/sensor'
          import { getScene, SCENE_AOD } from '@zos/app'
          
          const WHITE=0xFFFFFF, YELLOW=0xFFC51A, MUTED=0xA5A8AE
          const WD=['','ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС']
          const MONTH=['','ЯНВ','ФЕВ','МАР','АПР','МАЙ','ИЮН','ИЮЛ','АВГ','СЕН','ОКТ','НОЯ','ДЕК']
          function z(n){return String(n).padStart(2,'0')}
          function label(x,y,w,h,size,color,value){
            return ui.createWidget(ui.widget.TEXT,{
              x,y,w,h,text:value,color,text_size:size,
              text_style:ui.text_style.NONE,
              align_h:ui.align.CENTER_H,align_v:ui.align.CENTER_V
            })
          }
          function change(widget,text){if(widget)widget.setProperty(ui.prop.TEXT,String(text))}
          function safe(callback,fallback){try{return callback()}catch(e){return fallback}}
          let clock
          let fields={}
          WatchFace({
            build(){
              clock = new Time()
              if(getScene() === SCENE_AOD){
                ui.createWidget(ui.widget.FILL_RECT,{x:0,y:0,w:480,h:480,color:0x000000})
                fields.time=label(65,190,350,105,80,WHITE,'00:00')
                fields.date=label(116,287,248,28,18,YELLOW,'')
                label(135,340,210,26,18,YELLOW,'DEAL_ГНБ')
              }else{
                ui.createWidget(ui.widget.IMG,{x:0,y:0,w:480,h:480,src:'images/background.png'})
                fields.time=label(24,190,432,112,96,WHITE,'00:00')
                fields.date=label(62,285,356,42,23,YELLOW,'')
                const xs=[62,155,249,340], ws=[80,86,88,80]
                fields.battery=label(xs[0],385,ws[0],36,25,WHITE,'--%')
                fields.steps=label(xs[1],385,ws[1],36,25,WHITE,'--')
                fields.heart=label(xs[2],385,ws[2],36,25,WHITE,'--')
                fields.weather=label(xs[3],385,ws[3],36,25,WHITE,'--')
                safe(()=>{
                  const b=new Battery()
                  change(fields.battery,b.getCurrent()+'%')
                  b.onChange(()=>change(fields.battery,b.getCurrent()+'%'))
                },null)
                safe(()=>{
                  const s=new Step()
                  change(fields.steps,s.getCurrent())
                  s.onChange(()=>change(fields.steps,s.getCurrent()))
                },null)
                safe(()=>{
                  const h=new HeartRate()
                  const v=h.getLast()
                  change(fields.heart,v>0?v:'--')
                  h.onLastChange(()=>{
                    const latest=h.getLast()
                    change(fields.heart,latest>0?latest:'--')
                  })
                },null)
                // Weather is intentionally omitted until the core face is stable on-device.
              }
              const update=()=>{
                change(fields.time,z(clock.getHours())+':'+z(clock.getMinutes()))
                if(fields.date)change(fields.date,z(clock.getDate())+' '+MONTH[clock.getMonth()]+' '+clock.getFullYear()+'   '+(WD[clock.getDay()]||''))
              }
              update()
              clock.onPerMinute(update)
            }
          })
          '''
          dest=out/"watchface/default-target/index.js"
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(code.strip()+"\n", encoding="utf-8")
          print("Project reconstructed. Source JS:",len(code),"Background:",len(bg),"AOD:",len(aod))
          
          PY
      - name: Install official Zeus CLI
        run: npm install --global @zeppos/zeus-cli
      - name: Compile with Zeus CLI
        working-directory: zepp-project
        run: timeout 360s zeus build
      - name: Inspect output
        run: find zepp-project/dist -maxdepth 5 -type f -printf '%p %s bytes\n'
      - name: Extract compiled ZPK and verify integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          packages=list(Path("zepp-project/dist").rglob("*.zab"))
          assert len(packages)==1, f"Expected a single ZAB, found: {packages}"
          with ZipFile(packages[0]) as zab:
              print("ZAB entries:", zab.namelist())
              candidates=[x for x in zab.namelist() if x.endswith(".zpk") and not x.endswith("/")]
              assert len(candidates)>=1, "Compiled ZAB does not contain a ZPK package"
              zpk=zab.read(candidates[0])
          dest=Path("releases/DEAL_GNB_Balance2_Official_1.0.2.zpk")
          dest.write_bytes(zpk)
          with ZipFile(dest) as pkg:
              names=pkg.namelist()
              print("ZPK entries:",names)
              assert any(n.lower()=="device.zip" for n in names), "device.zip missing"
              assert pkg.testzip() is None, "ZPK integrity failed"
          print("Official compiled ZPK:",dest, dest.stat().st_size)
          PY
      - name: Publish compiled ZPK in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/DEAL_GNB_Balance2_Official_1.0.2.zpk
          if ! git diff --cached --quiet; then
            git commit -m "Publish 1.0.2 centered dial and AOD"
            git push
          fi
      - name: Upload compiled package for review
        uses: actions/upload-artifact@v4
        with:
          name: DEAL_GNB_Balance2_Zeus_Build
          path: zepp-project/dist/**
