name: Build DEAL GNB watchface with Zeus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-watchface.yml'
      - 'scripts/build_v107.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install image dependency
        run: python3 -m pip install --quiet pillow

      - name: Generate watchface and inspect assets
        run: |
          python3 scripts/build_v107.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          app = json.loads(Path('zepp-project/app.json').read_text())
          assert app['targets']['default-target']['module']['watchface']['lockscreen'] == 1
          assert app['app']['version']['name'] == '1.0.7'
          img=Image.open('zepp-project/assets/default-target/images/background.png')
          assert img.size == (480,480), img.size
          from PIL import Image
          aod=Image.open('zepp-project/assets/default-target/images/aod_bg.png')
          assert aod.size == (480,480)
          js=Path('zepp-project/watchface/default-target/index.js').read_text()
          assert "WEATHER_CURRENT" in js and "ONAL_AOD" in js and "IMG_TIME" in js
          assert "aod_bg.png" in js and "getSeconds" in js
          weather=Path('zepp-project/assets/default-target/images/weather')
          assert len(list(weather.glob('*.png'))) == 11, "Expected 10 digits and minus image"
          contours=Path('zepp-project/assets/default-target/images/aod_digits')
          assert len(list(contours.glob('*.png'))) == 10, "Expected outlined 0-9 glyph assets"
          assert 'ПОНЕДЕЛЬНИК' in js and "getMonth()" in js
          assert "seconds=label(399,218,52,69,52" in js
          assert "widgets.bat=label(94,374,62,39,21" in js
          build_source=Path('scripts/build_v107.py').read_text()
          assert 'ad.arc(' not in build_source, "Unwanted AOD arcs remain"
          print('Source verified, real full-size background:',img.size)
          PY

      - name: Install official Zeus CLI
        run: npm install --global @zeppos/zeus-cli

      - name: Compile with Zeus
        working-directory: zepp-project
        run: timeout 360s zeus build

      - name: Verify ZPK and extract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          zabfiles=list(Path('zepp-project/dist').rglob('*.zab'))
          assert len(zabfiles)==1, zabfiles
          with ZipFile(zabfiles[0]) as zab:
            print('ZAB files',zab.namelist())
            zpkfiles=[x for x in zab.namelist() if x.endswith('.zpk')]
            assert zpkfiles, 'No compiled ZPK in ZAB'
            raw=zab.read(zpkfiles[0])
          dest=Path('releases/DEAL_GNB_Balance2_Official_1.0.7.zpk')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(raw)
          with ZipFile(BytesIO(raw)) as zpk:
            assert zpk.testzip() is None
            assert any(x.endswith('device.zip') for x in zpk.namelist())
            print('Compiled ZPK verified; files:',zpk.namelist())
          print('Published package size:',dest.stat().st_size)
          PY

      - name: Publish built ZPK and preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/DEAL_GNB_Balance2_Official_1.0.7.zpk previews/DEAL_GNB_v1.0.7_background.png previews/DEAL_GNB_v1.0.7_aod.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled watchface 1.0.7 with custom AOD"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DEAL_GNB_Balance2_1.0.7_Compiled
          path: zepp-project/dist/**
